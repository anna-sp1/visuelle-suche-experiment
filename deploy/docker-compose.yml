# JATOS for the visual search experiment: JATOS and its MySQL database. HTTPS and the
# certificates are the job of an nginx proxy in front (deploy/README.md), not of this stack.
# Settings come from deploy/.env (copy .env.example). Setup and operation: deploy/README.md.
name: visuelle-suche

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: jatos
      MYSQL_USER: jatos
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in deploy/.env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u jatos -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30

  jatos:
    image: jatos/jatos:3.11.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      JATOS_DB_URL: "jdbc:mysql://db/jatos?characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      JATOS_DB_USERNAME: jatos
      JATOS_DB_PASSWORD: ${DB_PASSWORD}
      JATOS_DB_DRIVER: com.mysql.cj.jdbc.Driver
    # Passed to JATOS after "start": cookies only over HTTPS, since participants and the research team
    # reach JATOS only through the HTTPS proxy (and http://localhost, which browsers allow).
    command: ["-Dplay.http.session.secure=true", "-Djatos.idCookies.secure=true"]
    volumes:
      # Study assets, result files, study logs (the database holds the result data).
      - jatos-data:/opt/jatos_data
      - jatos-logs:/opt/jatos/logs
    # Plain HTTP for the nginx proxy. Only on 127.0.0.1 unless JATOS_BIND says otherwise
    # (nginx on another machine); see README.md before changing it.
    ports:
      - "${JATOS_BIND:-127.0.0.1}:${JATOS_PORT:-9000}:9000"

volumes:
  db-data:
  jatos-data:
  jatos-logs:
